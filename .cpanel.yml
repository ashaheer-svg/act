---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html/act
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rsync -avz --exclude='.git*' ./ $DEPLOYPATH
    # Fix Permissions for cPanel compliance
    - /bin/chmod 755 $DEPLOYPATH
    - /usr/bin/find $DEPLOYPATH -type d -exec chmod 755 {} +
    - /usr/bin/find $DEPLOYPATH -type f -exec chmod 644 {} +
    # Specifically ensure the hidden private storage is writable
    - /bin/chmod -R 755 $DEPLOYPATH/.act_private || true
    - /bin/chmod 664 $DEPLOYPATH/.act_private/data/sales_bi.db || true
